<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Simple transition for showing/hiding views */
        .view {
            display: none;
            animation: fadeIn 0.5s;
        }
        .view.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100">

    <div class="min-h-screen text-slate-800 p-4 sm:p-8 flex flex-col items-center">
        <!-- Error Modal -->
        <div id="error-modal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 hidden">
            <div class="bg-white rounded-lg shadow-xl p-6 w-11/12 max-w-sm text-center">
                <p id="error-message" class="mb-4 text-slate-700"></p>
                <button id="close-modal-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                    Close
                </button>
            </div>
        </div>

        <!-- Header -->
        <div class="w-full max-w-5xl text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-teal-500">
                    AI Photo Editor
                </span>
            </h1>
            <p class="mt-3 max-w-2xl mx-auto text-lg text-slate-600">
                Upload your photo and reimagine it in a stunning new style with a single click.
            </p>
        </div>

        <main id="app-container" class="w-full max-w-5xl">
            <!-- View 1: Style Selector -->
            <div id="style-selector-view" class="view active">
                <div class="text-center">
                    <h2 class="text-2xl font-bold text-slate-700 mb-2">Step 1: Choose a Style</h2>
                    <p class="text-slate-500 mb-6">Select a transformation style to apply to your image.</p>
                    <div id="style-cards-container" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <!-- Style cards will be injected here by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- View 2: Uploader -->
            <div id="uploader-view" class="view">
                <div class="w-full max-w-lg mx-auto text-center">
                    <h2 class="text-2xl font-bold text-slate-700 mb-2">Step 2: Upload Your Image</h2>
                    <p class="text-slate-500 mb-4">You selected the <span id="selected-style-name" class="font-semibold text-blue-600"></span> style.</p>
                    <div class="bg-white p-6 rounded-xl shadow-md">
                        <div class="w-full h-64 border-2 border-dashed border-slate-300 rounded-lg flex justify-center items-center mb-4 bg-slate-50 overflow-hidden">
                            <img id="upload-preview" src="" alt="Upload preview" class="h-full w-full object-cover hidden" />
                            <span id="upload-placeholder" class="text-slate-400">Image Preview</span>
                        </div>
                        <input type="file" accept="image/*" id="file-upload" class="hidden" />
                        <button id="choose-image-btn" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2 px-4 rounded-lg mb-3 transition-colors">
                            Choose Image
                        </button>
                        <button id="generate-btn" disabled class="w-full bg-blue-500 hover:bg-blue-600 disabled:bg-blue-300 text-white font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center">
                            <span id="generate-btn-text">Generate Transformed Image</span>
                            <div id="spinner" class="animate-spin rounded-full h-6 w-6 border-b-2 border-white hidden"></div>
                        </button>
                    </div>
                    <button id="back-to-styles-btn" class="mt-4 text-slate-500 hover:text-slate-700 text-sm font-semibold">&larr; Back to Styles</button>
                </div>
            </div>

            <!-- View 3: Result -->
            <div id="result-view" class="view">
                 <div class="w-full max-w-4xl mx-auto text-center">
                     <h2 class="text-2xl font-bold text-slate-700 mb-4">Your Transformed Image!</h2>
                     <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center bg-white p-6 rounded-xl shadow-md">
                        <div>
                            <h3 class="font-semibold text-slate-600 mb-2">Original</h3>
                            <img id="result-original-image" src="" alt="Original" class="w-full rounded-lg" />
                        </div>
                         <div>
                            <h3 class="font-semibold text-slate-600 mb-2">Transformed</h3>
                            <img id="result-transformed-image" src="" alt="Generated" class="w-full rounded-lg" />
                        </div>
                     </div>
                     <div class="mt-6 flex justify-center gap-4">
                         <button id="start-over-btn" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2 px-6 rounded-lg transition-colors">
                             Start Over
                         </button>
                         <button id="download-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg transition-colors">
                             Download Image
                         </button>
                     </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- App Data ---
            const predefinedPrompts = [
                 {
                    id: 'retro-portrait',
                    name: '70s Retro Portrait',
                    prompt: 'Transform this image into a retro-style portrait with 1970s fashion, soft lighting, pastel colors, a vintage aesthetic, and 35mm film grain.',
                    beforeImage: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=400&q=80',
                    afterImage: 'https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=400&q=80'
                },
                {
                    id: 'watercolor-painting',
                    name: 'Watercolor Painting',
                    prompt: 'Turn this image into a beautiful watercolor painting with soft edges, vibrant washes of color, and visible paper texture.',
                    beforeImage: 'https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=400&q=80',
                    afterImage: 'https://images.unsplash.com/photo-1536924940846-227afb31e2a5?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=400&q=80'
                },
                {
                    id: 'neon-punk',
                    name: 'Neon Punk',
                    prompt: 'Convert this image into a neon punk art style, with glowing neon highlights, a dark background, and a cyberpunk feel.',
                    beforeImage: 'https://images.unsplash.com/photo-1504257432389-52343af06ae3?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=400&q=80',
                    afterImage: 'https://images.unsplash.com/photo-1544415239-130d75591635?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=400&q=80'
                },
                {
                    id: 'vintage-comic',
                    name: 'Vintage Comic Book',
                    prompt: 'Transform this picture into a page from a vintage comic book, with bold lines, dot shading (Ben-Day dots), and a classic, heroic color scheme.',
                    beforeImage: 'https://images.unsplash.com/photo-1618979293421-a3c8615b1b46?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=400&q=80',
                    afterImage: 'https://images.unsplash.com/photo-1624560344219-487a55567a52?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=400&q=80'
                }
            ];

            // --- State Variables ---
            let selectedStyle = null;
            let uploadedImage = null; // { file: File, preview: string, base64: string }
            let generatedImage = null; // base64 data URI
            let isLoading = false;

            // --- DOM Elements ---
            const views = {
                styleSelector: document.getElementById('style-selector-view'),
                uploader: document.getElementById('uploader-view'),
                result: document.getElementById('result-view'),
            };
            const styleCardsContainer = document.getElementById('style-cards-container');
            const fileUploadInput = document.getElementById('file-upload');
            const chooseImageBtn = document.getElementById('choose-image-btn');
            const generateBtn = document.getElementById('generate-btn');
            const startOverBtn = document.getElementById('start-over-btn');
            const downloadBtn = document.getElementById('download-btn');
            const backToStylesBtn = document.getElementById('back-to-styles-btn');
            const errorModal = document.getElementById('error-modal');
            const errorMessage = document.getElementById('error-message');
            const closeModalBtn = document.getElementById('close-modal-btn');

            // --- UI Update Functions ---
            const switchView = (viewName) => {
                Object.values(views).forEach(view => view.classList.remove('active'));
                if (views[viewName]) {
                    views[viewName].classList.add('active');
                }
            };
            
            const showError = (message) => {
                errorMessage.textContent = message;
                errorModal.classList.remove('hidden');
            };

            const hideError = () => {
                errorModal.classList.add('hidden');
            };

            const setLoading = (loading) => {
                isLoading = loading;
                generateBtn.disabled = isLoading || !uploadedImage;
                document.getElementById('spinner').classList.toggle('hidden', !loading);
                document.getElementById('generate-btn-text').classList.toggle('hidden', loading);
            };

            const populateStyleCards = () => {
                styleCardsContainer.innerHTML = '';
                predefinedPrompts.forEach(style => {
                    const card = document.createElement('div');
                    card.className = 'bg-white p-4 rounded-xl shadow-md cursor-pointer transition-all duration-300 hover:shadow-lg hover:scale-105';
                    card.innerHTML = `
                        <div class="flex justify-center items-center gap-2 mb-3">
                            <img src="${style.beforeImage}" alt="Before" class="w-1/2 rounded-lg" />
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" /></svg>
                            <img src="${style.afterImage}" alt="After" class="w-1/2 rounded-lg" />
                        </div>
                        <h3 class="font-semibold text-slate-800">${style.name}</h3>
                    `;
                    card.addEventListener('click', () => handleStyleSelect(style));
                    styleCardsContainer.appendChild(card);
                });
            };

            // --- Event Handlers ---
            const handleStyleSelect = (style) => {
                selectedStyle = style;
                document.getElementById('selected-style-name').textContent = style.name;
                switchView('uploader');
            };

            const handleFileChange = (event) => {
                const file = event.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64String = reader.result.split(',')[1];
                        uploadedImage = {
                            file: file,
                            preview: URL.createObjectURL(file),
                            base64: base64String,
                        };
                        
                        const previewImg = document.getElementById('upload-preview');
                        previewImg.src = uploadedImage.preview;
                        previewImg.classList.remove('hidden');
                        document.getElementById('upload-placeholder').classList.add('hidden');
                        generateBtn.disabled = false;
                    };
                    reader.readAsDataURL(file);
                } else {
                    showError("Please select a valid image file.");
                    uploadedImage = null;
                    generateBtn.disabled = true;
                }
            };
            
            const handleGenerate = async () => {
                if (!uploadedImage?.base64 || !selectedStyle) {
                    showError('Please upload an image and select a style.');
                    return;
                }

                setLoading(true);

                const payload = {
                    contents: [{
                        parts: [
                            { text: selectedStyle.prompt },
                            { inlineData: { mimeType: uploadedImage.file.type, data: uploadedImage.base64 } }
                        ]
                    }],
                    generationConfig: { responseModalities: ['IMAGE'] },
                };

                const apiKey = ""; // API key is injected by the environment
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`;

                let response;
                let success = false;
                for (let i = 0; i < 4; i++) {
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload),
                        });
                        if (response.ok) {
                            success = true;
                            break;
                        }
                        if (response.status === 429 || response.status >= 500) {
                             await new Promise(res => setTimeout(res, (2 ** i) * 1000));
                        } else {
                            break;
                        }
                    } catch (err) {
                        if (i === 3) {
                            showError("Network error. Please check your connection.");
                            setLoading(false);
                            return;
                        }
                        await new Promise(res => setTimeout(res, (2 ** i) * 1000));
                    }
                }
                
                if (!success || !response) {
                     showError('The image could not be generated after multiple attempts. Please try again later.');
                     setLoading(false);
                     return;
                }
                
                try {
                    const result = await response.json();
                    const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    if (base64Data) {
                        generatedImage = `data:image/png;base64,${base64Data}`;
                        document.getElementById('result-original-image').src = uploadedImage.preview;
                        document.getElementById('result-transformed-image').src = generatedImage;
                        switchView('result');
                    } else {
                         const errorText = result.error?.message || 'No image data found in API response. The content may have been blocked.';
                         throw new Error(errorText);
                    }
                } catch (err) {
                    showError(`An error occurred: ${err.message}`);
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };
            
            const handleStartOver = () => {
                selectedStyle = null;
                uploadedImage = null;
                generatedImage = null;
                
                fileUploadInput.value = ""; // Reset file input
                const previewImg = document.getElementById('upload-preview');
                previewImg.src = "";
                previewImg.classList.add('hidden');
                document.getElementById('upload-placeholder').classList.remove('hidden');
                
                switchView('styleSelector');
            };

            const handleDownload = () => {
                const link = document.createElement('a');
                link.href = generatedImage;
                link.download = `transformed-${Date.now()}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // --- Initial Setup & Event Listeners ---
            chooseImageBtn.addEventListener('click', () => fileUploadInput.click());
            fileUploadInput.addEventListener('change', handleFileChange);
            generateBtn.addEventListener('click', handleGenerate);
            startOverBtn.addEventListener('click', handleStartOver);
            downloadBtn.addEventListener('click', handleDownload);
            backToStylesBtn.addEventListener('click', () => switchView('styleSelector'));
            closeModalBtn.addEventListener('click', hideError);
            
            populateStyleCards();
            switchView('styleSelector');
        });
    </script>

</body>
</html>
